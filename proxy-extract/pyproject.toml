[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-extract"
version = "0.1.0"
description = "Extract Depth + Semantic-ID proxy conditions from gameplay video for the CWM v2v dataset"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    # Vendors a static ffmpeg build. Core rather than optional because the
    # delivery encoders shell out to ffmpeg and the encoding tests exercise
    # them, and because ffmpeg is not pip-installable any other way: without
    # this, a node whose operator has no root has no route to a working install.
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Heavy model backends. Imported lazily so the contract, QC, taxonomy and
# encoding layers stay usable (and testable) without a GPU.
depth = ["torch>=2.4", "mapanything"]
semantic = ["torch>=2.4", "transformers>=4.45"]
sam3 = ["torch>=2.4", "sam3"]
dev = ["pytest>=7.4"]

[project.scripts]
proxy-extract = "proxy_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
