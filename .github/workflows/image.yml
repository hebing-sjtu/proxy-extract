# Builds the linux/amd64 image the GPU nodes pull, tests it, and pushes it.
#
# Configure once, in the repository settings:
#
#   Variables  REGISTRY    registry.example.com          (default: ghcr.io)
#              IMAGE_NAME  your-team/proxy-extract       (default: this repo)
#              REGISTRY_USERNAME                         (default: github.actor)
#   Secrets    REGISTRY_PASSWORD                         (default: GITHUB_TOKEN)
#
# With nothing configured it publishes to this repository's GHCR, which is
# enough to prove the pipeline works before pointing it at a private registry.

name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded build is 20 wasted minutes of runner time, most of it torch.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # torch alone unpacks to ~2.5 GB and the finished image is 6-8 GB. A
        # stock runner has roughly 14 GB free, which is not enough margin once
        # buildx also keeps a cache.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Resolve the image reference
        id: ref
        run: |
          registry="${{ vars.REGISTRY || 'ghcr.io' }}"
          name="${{ vars.IMAGE_NAME || github.repository }}"
          # GHCR rejects uppercase, and GitHub org names often have it.
          name="$(echo "$name" | tr '[:upper:]' '[:lower:]')"
          # Single source of truth: the Makefile the humans also use.
          version="$(make -s version)"

          echo "registry=$registry"                        >> "$GITHUB_OUTPUT"
          echo "image=$registry/$name:$version"            >> "$GITHUB_OUTPUT"
          echo "sha_image=$registry/$name:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=$registry/$name:latest"             >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Only amd64. The torch wheel that bundles CUDA is published for
      # linux/x86_64 only, so an arm64 variant of this image could not run the
      # pipeline even where it did build.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test inside the image
        # The suite needs no GPU and no weights, so it runs here rather than
        # being discovered on a node after a push.
        run: |
          docker run --rm ${{ steps.ref.outputs.image }} proxy-extract --help
          docker run --rm ${{ steps.ref.outputs.image }} \
            pytest /opt/proxy-extract/tests -q -p no:cacheprovider

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.ref.outputs.registry }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        # Same context and cache as the build above, so this re-exports layers
        # rather than rebuilding them.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.sha_image }}
            ${{ github.ref == 'refs/heads/main' && steps.ref.outputs.latest || '' }}
          cache-from: type=gha

      - name: Say how to pull it
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '## Pull this on a GPU node'
            echo
            echo '```bash'
            echo 'docker pull ${{ steps.ref.outputs.sha_image }}'
            echo 'export IMAGE=${{ steps.ref.outputs.sha_image }}'
            echo '```'
            echo
            echo 'The sha tag is the one to pin in a batch run; '
            echo 'the version tag moves.'
          } >> "$GITHUB_STEP_SUMMARY"
