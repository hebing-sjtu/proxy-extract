[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-prompts"
version = "0.1.0"
description = "Timestamped VLM captions for the ABot SFT clips"
requires-python = ">=3.10"
# The VLM transport is `clip_prompts.llm` and is standard library throughout,
# so the only things to install are the two that read pixels. That is the point:
# the caption nodes cannot reach the internal package index or Git host, and an
# `openssl` binary is easier to guarantee there than a crypto wheel.
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
clip-prompts = "clip_prompts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
